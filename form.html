<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Product Review - Janisse</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals | Janisse Rodriguez | Product Review Form">
    <meta name="author" content="Janisse Rodriguez">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <span id="course-title">WDD 131 - Dynamic Web Fundamentals</span>
    </header>
    <main>

        <h1>Product Review</h1>
            <form method="get" action="review.html" class="wf1">
                <fieldset>
                    <label for="product">Product Name</label>
                        <select id="product" name="product" required>
                            <option value="" disabled selected >Select a Product ...</option>
                        </select>
                </fieldset>

                <fieldset>
                    <legend>Overall Rating</legend>

                        <input type="radio" id="one" name="rating" value="one" required> <!--"type" gives different keyboards to just show letters, dates or add @,/.-->
                        <label for="one">1</label> 
                        <label><input type="radio" id="two" name="rating" value="two" required>
                        <label for="two">2</label>
                        <label><input type="radio" id="three" name="rating" value="three" required>
                        <label for="three">3</label>
                        <label><input type="radio" id="four" name="rating" value="four" required>
                        <label for="four">4</label>
                        <label><input type="radio" id="five" name="rating" value="five" required>
                        <label for="five">5</label>
                </fieldset>

                <fieldset>
                    <label for="dateI">Date of Installation</label>
                    <input id="dateI" type="date" name="dateInstal" required> <!--this "type" ""date"" gives a keyboard to show dd/mm/aaaa -->
                    
                </fieldset>

                <fieldset>
                    <legend>Useful Features</legend>
                    <input id="durability" type="checkbox" name="features" value="durability">
                    <label for ="durability">Durability</label> <!-- this "type" ""checkbox"" shows as a box to select -->
                    <input id="ease" type="checkbox" name="features" value="ease">
                    <label for="ease">Ease of Use</label>
                    <input id="performance" type="checkbox" name="features" value="performance">
                    <label for="performance">Performance</label>
                    <input id="design" type="checkbox" name="features" value="design">
                    <label for="design">Design</label>
                </fieldset>

                <fieldset>
                    <label for="review">Written Review
                    (Optional)</label>
                    <textarea id="review" name="reviewContent"></textarea>
                    
                </fieldset>

                <fieldset>
                    <label for="name">Your Name
                    (Optional)</label>
                    <input type="text" id="name" name="userName"><!--"type" ""text"" gives a keyboards that shows letters-->
                
                </fieldset>

                    <input type="submit" value="Post Review"><!--"type" ""text"" gives a keyboards that shows letters-->

            </form>
    </main>

    <footer>
        <p>©<span id="currentyear"></span> ⭐Janisse Rodriguez⭐ Peru</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
