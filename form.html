<body>
    <header>
        <span id="course-title">WDD 131 - Dynamic Web Fundamentals</span>
        <nav>
            <a href="https://www.linkedin.com/">LinkedIn</a>

    <main>

        <h1>Janisse Alondra Rodriguez Cumba</h1>
            <form method="get" action ="review.html">
                <fieldset>
                    <legend>Product Name</legend>
                    <select id="product" name="product" required>
                        <option value="">Select a Product</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Overall Rating</legend>
                        <label><input type="radio" name="rating" value="one" required>1</label> <!--"type" gives different keyboards to just show letters, dates and add @,/.-->
                        <label><input type="radio" name="rating" value="two" required>2</label>
                        <label><input type="radio" name="rating" value="three" required>3</label>
                        <label><input type="radio" name="rating" value="four" required>4</label>
                        <label><input type="radio" name="rating" value="five" required>5</label>
                </fieldset>

                <fieldset>
                    <legend>Date of Installation</legend>
                    <input id="date" type="date" name="dateInstal" required> <!--"type" gives different keyboards to show dd/mm/aaaa -->
                    
                </fieldset>

            </form>
    </main>
